# Kiro SRE Monitor Agent - Docker Compose
# Runs the agent and backend together for local development

version: '3.8'

services:
  # Kiro SRE Agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - KIRO_ENVIRONMENT=dev
      - KIRO_DEBUG=true
      - KIRO_USE_MOCK_AWS=true
      - KIRO_AWS_REGION=us-east-1
      - KIRO_BEDROCK_MODEL_ID=anthropic.claude-3-sonnet-20240229-v1:0
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend (E-Commerce Microservices)
  backend:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - LOG_GROUP_NAME=/kiro/microservices/backend
      - AWS_REGION=us-east-1
    volumes:
      - ../Backend:/app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               uvicorn src.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
